# Сетевые политики по принципу «запрещено всё, что не разрешено явно».
# Разрешены только переходы цепочки gateway → authz/business → data
# и отправка событий в audit от всех сервисов паттерна
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: secure-storage}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-from-anywhere, namespace: secure-storage}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: ["Ingress"]
  ingress:
    - ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: authz-from-gateway, namespace: secure-storage}
spec:
  podSelector: {matchLabels: {app: authz-service}}
  policyTypes: ["Ingress"]
  ingress:
    - from: [{podSelector: {matchLabels: {app: gateway}}}]
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: business-from-gateway, namespace: secure-storage}
spec:
  podSelector: {matchLabels: {app: business-service}}
  policyTypes: ["Ingress"]
  ingress:
    - from: [{podSelector: {matchLabels: {app: gateway}}}]
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: data-from-business, namespace: secure-storage}
spec:
  podSelector: {matchLabels: {app: data-service}}
  policyTypes: ["Ingress"]
  ingress:
    - from: [{podSelector: {matchLabels: {app: business-service}}}]
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: audit-from-pattern, namespace: secure-storage}
spec:
  podSelector: {matchLabels: {app: audit-service}}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [gateway, authz-service, business-service, data-service]}
      ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres-from-data, namespace: secure-storage}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: ["Ingress"]
  ingress:
    - from: [{podSelector: {matchLabels: {app: data-service}}}]
      ports: [{port: 5432}]
