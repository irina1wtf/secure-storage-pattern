# Business-Service — бизнес-логика, без доступа к хранилищу
apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-service
  namespace: secure-storage
  labels: {app: business-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: business-service}
  template:
    metadata:
      labels: {app: business-service}
    spec:
      serviceAccountName: business-sa
      automountServiceAccountToken: false
      containers:
        - name: business-service
          image: secure-storage/business:1.0
          imagePullPolicy: Never           # образ собран и импортирован локально
          ports: [{containerPort: 8000}]
          env:
            - name: CTX_GATEWAY_KEY
              valueFrom: {secretKeyRef: {name: ctx-gateway-key, key: key}}
            - name: CTX_BUSINESS_KEY
              valueFrom: {secretKeyRef: {name: ctx-business-key, key: key}}
            - name: VALIDATION_ENABLED
              valueFrom: {configMapKeyRef: {name: app-config, key: VALIDATION_ENABLED}}
            - name: MAX_RECORD_BYTES
              valueFrom: {configMapKeyRef: {name: app-config, key: MAX_RECORD_BYTES}}
            - name: AUDIT_URL
              value: "http://audit-service:8000"
            - name: DATA_URL
              value: "http://data-service:8000"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: business-service
  namespace: secure-storage
spec:
  type: ClusterIP
  selector: {app: business-service}
  ports:
    - port: 8000
      targetPort: 8000
