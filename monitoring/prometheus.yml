# Сбор метрик микросервисов паттерна. Каждый сервис отдаёт метрики по адресу /metrics/
global:
  scrape_interval: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics/
    static_configs: [{targets: ["gateway.secure-storage.svc:8000"]}]
  - job_name: authz-service
    metrics_path: /metrics/
    static_configs: [{targets: ["authz-service.secure-storage.svc:8000"]}]
  - job_name: business-service
    metrics_path: /metrics/
    static_configs: [{targets: ["business-service.secure-storage.svc:8000"]}]
  - job_name: data-service
    metrics_path: /metrics/
    static_configs: [{targets: ["data-service.secure-storage.svc:8000"]}]
  - job_name: audit-service
    metrics_path: /metrics/
    static_configs: [{targets: ["audit-service.secure-storage.svc:8000"]}]
